name: gamehub
description: تطبيق ألعاب ويب مرخّصة (Flutter) — نسخة معاد كتابتها من مشروع Godot "khayal".
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0
  google_mobile_ads: ^5.2.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  shaders:
    - shaders/net_loader.frag
    - shaders/button_glow.frag

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
