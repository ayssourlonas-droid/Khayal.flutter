name: gamehub_control
description: تطبيق التحكم بألعاب الويب (Flutter) — نسخة معاد كتابتها من مشروع Godot "mota7akm".
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.5
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  webview_flutter: ^4.9.0
  url_launcher: ^6.3.0
  pinenacl: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
