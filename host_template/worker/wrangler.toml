name = "khayal-games-router"
main = "game-router.js"
compatibility_date = "2024-09-23"

# غيّر هذه القيم:
routes = [
  { pattern = "*.games.example.com/*", zone_name = "example.com" }
]

[vars]
BASE_DOMAIN = "games.example.com"
ORIGIN = "https://YOUR-HOST.pages.dev"

