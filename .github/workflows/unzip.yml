name: unzip-upload

# يفكّ ملف زيب رُفع للمستودع، وينسخ محتواه مكان القديم، ثم يحذف الزيب.
# التشغيل: Actions ← unzip-upload ← Run workflow.
on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "مسار ملف الزيب في المستودع"
        default: "gamehub_monorepo.zip"
      clean:
        description: "حذف المجلدات القديمة قبل النسخ (yes/no)"
        default: "yes"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # UNZIP_TOKEN اختياري: مفتاح PAT بصلاحية Contents + Workflows (Read and write)
          # بدونه لا يستطيع GitHub تعديل ملفات .github/workflows، فيتخطاها هذا السكربت.
          token: ${{ secrets.UNZIP_TOKEN || github.token }}
      - name: Unzip and replace
        env:
          ZIP: ${{ inputs.zip_path }}
          CLEAN: ${{ inputs.clean }}
          HAS_PAT: ${{ secrets.UNZIP_TOKEN != '' }}
        run: |
          set -euo pipefail
          [ -f "$ZIP" ] || { echo "::error::الملف غير موجود: $ZIP"; exit 1; }
          X="$RUNNER_TEMP/x"; rm -rf "$X"; mkdir -p "$X"
          unzip -q "$ZIP" -d "$X"
          rm -rf "$X/__MACOSX"
          SRC="$X"
          if [ "$(ls -A "$X" | wc -l)" = "1" ] && [ -d "$X/$(ls -A "$X")" ]; then
            SRC="$X/$(ls -A "$X")"   # الجذر: مجلد واحد (monorepo) فندخل إليه
          fi
          for p in "$SRC"/* "$SRC"/.[!.]*; do
            [ -e "$p" ] || continue
            n="$(basename "$p")"
            if [ "$n" = ".github" ]; then
              if [ "$HAS_PAT" != "true" ]; then
                echo "::warning::تخطّيت .github (لا يوجد UNZIP_TOKEN). أنشئ ملفات workflows يدوياً أو أضف المفتاح."
                continue
              fi
              cp -a "$p/." .github/          # دمج بدل الحذف كي يبقى unzip.yml
              continue
            fi
            [ "$CLEAN" = "yes" ] && rm -rf "./$n"
            cp -a "$p" "./$n"
          done
          git rm -q -f "$ZIP" || rm -f "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "لا تغييرات"; exit 0; }
          git commit -q -m "Unpack $ZIP"
          git push
