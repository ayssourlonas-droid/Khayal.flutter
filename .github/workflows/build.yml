name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      # 1) نولّد هيكل أندرويد (الحزمة com.lamoushi.gamehub) دون المساس بملفاتنا
      - name: Create Android scaffold
        run: |
          flutter create --org com.lamoushi --project-name gamehub --platforms android .
          rm -rf test

      # 2) إعدادات أندرويد: minSdk، الأذونات، AdMob، التوقيع
      - name: Patch Android config
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: python3 tool/setup_android.py .

      # 3) التوقيع (اختياري): إن لم تضف الأسرار يُبنى APK بتوقيع debug
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release.jks"
            } > android/key.properties
            echo "Signing: release keystore"
          else
            echo "Signing: debug (no secrets set)"
          fi

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build AAB (للمتجر)
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: gamehub-apk
          path: build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gamehub-aab
          path: build/app/outputs/bundle/release/*.aab
