name: Build apps

# يُبنى تلقائياً عند كل تحديث لأي ملف. ما يُبنى يحدده الرقم في ملف BUILD_TARGET.txt:
#   السطر الأول فقط يُقرأ: 1 = خيال، 2 = متحكم، 12 أو 21 = كلاهما، وأي شيء آخر (لا 1 ولا 2) = لا يبني شيئاً
#   (ما بعد // أو # تعليق)
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.pick.outputs.games }}
      control: ${{ steps.pick.outputs.control }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          v=$(head -n 1 BUILD_TARGET.txt 2>/dev/null | sed 's|//.*||; s|#.*||' | tr -d ' \r\t' || true)
          echo "BUILD_TARGET = '$v'"
          g=false; a=false
          case "$v" in *1*) g=true;; esac
          case "$v" in *2*) a=true;; esac
          echo "games=$g control=$a"
          echo "games=$g" >> "$GITHUB_OUTPUT"
          echo "control=$a" >> "$GITHUB_OUTPUT"
  games:
    needs: select
    if: ${{ needs.select.outputs.games == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: games_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - name: Create Android scaffold
        run: |
          flutter create --org com.lamoushi --project-name gamehub --platforms android .
          rm -rf test
      - name: Patch Android config
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: python3 tool/setup_android.py .
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release.jks"
            } > android/key.properties
          fi
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Compute version
        id: ver
        run: |
          # الرقم الأول والثاني من pubspec.yaml (تغيّرهما بيدك)، والثالث ورقم البناء = رقم تشغيل هذا الـ workflow (يرتفع تلقائياً)
          base=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          mm=$(echo "$base" | cut -d. -f1,2)
          name="$mm.${{ github.run_number }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### إصدار خيال المبني: $name (رقم البناء ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "VERSION = $name"
      - name: Build APK
        run: flutter build apk --release --split-per-abi --build-name=${{ steps.ver.outputs.name }} --build-number=${{ github.run_number }}
      - name: Build AAB
        run: flutter build appbundle --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: gamehub-apk
          path: games_app/build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gamehub-aab
          path: games_app/build/app/outputs/bundle/release/*.aab

  control:
    needs: select
    if: ${{ needs.select.outputs.control == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: control_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - name: Create Android scaffold
        run: |
          flutter create --org com.lamoushi --project-name gamehub_control --platforms android .
          rm -rf test
      - name: Patch Android config
        env:
          APP_NAME: ${{ vars.CONTROL_APP_NAME }}
        run: python3 tool/setup_android.py .
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release.jks"
            } > android/key.properties
          fi
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Build single arm64 APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: gamehub-control-apk
          path: control_app/build/app/outputs/flutter-apk/app-release.apk
