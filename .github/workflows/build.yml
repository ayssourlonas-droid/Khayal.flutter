name: Build apps

# يُبنى تلقائياً عند كل تحديث لأي ملف. ما يُبنى يحدده الرقم في ملف BUILD_TARGET.txt:
#   1 = تطبيق خيال (games_app)   2 = تطبيق المتحكم (admin_app)   أي شيء آخر = كلاهما
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.pick.outputs.games }}
      admin: ${{ steps.pick.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          v=$(tr -d ' \r\n\t' < BUILD_TARGET.txt 2>/dev/null || true)
          echo "BUILD_TARGET = '$v'"
          if [ "$v" = "1" ]; then g=true; a=false
          elif [ "$v" = "2" ]; then g=false; a=true
          else g=true; a=true; fi
          echo "games=$g" >> "$GITHUB_OUTPUT"
          echo "admin=$a" >> "$GITHUB_OUTPUT"
  games:
    needs: select
    if: ${{ needs.select.outputs.games == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: games_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - name: Create Android scaffold
        run: |
          flutter create --org com.lamoushi --project-name gamehub --platforms android .
          rm -rf test
      - name: Patch Android config
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: python3 tool/setup_android.py .
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release.jks"
            } > android/key.properties
          fi
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Build APK
        run: flutter build apk --release --split-per-abi
      - name: Build AAB
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: gamehub-apk
          path: games_app/build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gamehub-aab
          path: games_app/build/app/outputs/bundle/release/*.aab

  admin:
    needs: select
    if: ${{ needs.select.outputs.admin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - name: Create Android scaffold
        run: |
          flutter create --org com.lamoushi --project-name gamehub_admin --platforms android .
          rm -rf test
      - name: Patch Android config
        env:
          APP_NAME: ${{ vars.ADMIN_APP_NAME }}
        run: python3 tool/setup_android.py .
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release.jks"
            } > android/key.properties
          fi
      - run: flutter pub get
      - name: Build single arm64 APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: gamehub-admin-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
