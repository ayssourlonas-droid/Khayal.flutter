name: Health check

# يفتح كل لعبة منشورة ويبلّغ عن المعطّل. أسبوعياً + يدوياً (Actions ← Health check ← Run workflow).
# إن وُجدت لعبة معطلة يفشل التشغيل فيصلك إشعار GitHub.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check games
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_BRANCH: ${{ vars.DATA_BRANCH }}
          HEALTH_OUT: ${{ github.workspace }}/health_out
        run: python3 tools/health_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health
          path: health_out
          if-no-files-found: ignore
